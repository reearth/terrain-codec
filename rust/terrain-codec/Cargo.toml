[package]
name = "terrain-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terrain processing utilities for 3D tile generation: seamless DEM-gradient normals, mesh helpers, and re-exports of martini-rs + quantized-mesh"
readme = "README.md"
keywords = ["terrain", "cesium", "quantized-mesh", "normals", "3d-tiles"]
categories = ["graphics", "science::geo"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Enable `heightmap::container` (PNG / WebP wrappers via the `image` crate).
image = ["dep:image"]
# Add AVIF encoding to `heightmap::container` (implies `image`). Pulls in
# the ravif encoder and dav1d decoder — heavier to compile and may need
# a system C toolchain on some platforms.
avif = ["image", "image/avif"]

[dependencies]
martini-rs = { version = "0.1", path = "../martini" }
quantized-mesh = { version = "0.1", path = "../quantized-mesh" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "webp",
] }

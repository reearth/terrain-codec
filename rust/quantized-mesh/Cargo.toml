[package]
name = "quantized-mesh"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Encoder and decoder for Cesium quantized-mesh-1.0 terrain format"
readme = "README.md"
keywords = ["cesium", "terrain", "quantized-mesh", "gis", "3d-tiles"]
categories = ["encoding", "graphics", "science::geo"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
flate2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# simd128 oct-normal encode is wasm-only; native stays scalar, so `wide`
# is only pulled in for wasm targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wide = "0.7"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "oct_normals"
harness = false

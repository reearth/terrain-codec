name: Release (crates.io)

on:
  push:
    tags:
      # martini-rs-v0.1.0, quantized-mesh-v0.1.0, ...
      - "martini-rs-v*"
      - "quantized-mesh-v*"
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish"
        required: true
        type: choice
        options:
          - martini-rs
          - quantized-mesh
      dry_run:
        description: "Dry run (do not actually publish)"
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Configure Trusted Publishing on crates.io for each crate
    # (https://crates.io/docs/trusted-publishing) — no long-lived
    # CARGO_REGISTRY_TOKEN secret needed.
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Determine target crate
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CRATE="${{ inputs.crate }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            # Strip the trailing -v<version> to recover the crate name.
            CRATE="${TAG%-v*}"
            DRY_RUN="false"
          fi
          case "$CRATE" in
            martini-rs)     DIR="martini" ;;
            quantized-mesh) DIR="quantized-mesh" ;;
            *) echo "::error::Unknown crate: $CRATE"; exit 1 ;;
          esac
          echo "crate=$CRATE"     >> "$GITHUB_OUTPUT"
          echo "dir=$DIR"         >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Resolved: crate=$CRATE dir=rust/$DIR dry_run=$DRY_RUN"

      - name: cargo publish --dry-run
        run: cargo publish -p "${{ steps.target.outputs.crate }}" --dry-run

      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        if: steps.target.outputs.dry_run != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish
        if: steps.target.outputs.dry_run != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p "${{ steps.target.outputs.crate }}"

[package]
name = "quantized-mesh"
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Encoder and decoder for Cesium quantized-mesh-1.0 terrain format"
readme = "README.md"
keywords = ["cesium", "terrain", "quantized-mesh", "gis", "3d-tiles"]
categories = ["encoding", "graphics", "science::geo"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
flate2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
